<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>song-suggest · Sortear</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path d="M16 3c7 0 12 4 12 10 0 7-7 16-12 16S4 20 4 13C4 7 9 3 16 3z" fill="%239184d9"/></svg>'>
<!-- El sistema de diseño va primero y sin tocar: es la fuente de verdad del
     aspecto. `style.css` sólo añade lo que esta app tiene y el sistema no. -->
<link rel="stylesheet" href="/nocturne.css">
<link rel="stylesheet" href="/style.css">

<header class="cabecera-app">
  <span class="marca">song-suggest</span>
  <nav aria-label="Vistas">
    <button id="ver-sorteo" class="activo">Sortear</button>
    <button id="ver-listas">Mis listas</button>
    <button id="ver-editor" hidden>Ampli</button>
  </nav>

  <label class="cancion-buscador">
    <span class="solo-lector">Buscar una canción o banda</span>
    <svg class="buscar-icono" width="15" height="15" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path></svg>
    <input id="cancion-q" type="text" autocomplete="off" spellcheck="false" placeholder="Buscar una canción o banda" aria-describedby="cancion-ayuda">
    <kbd aria-hidden="true">/</kbd>
    <ul id="cancion-sug" class="banda-sug" hidden></ul>
  </label>
  <p id="cancion-ayuda" class="solo-lector">Abre su tarjeta sin sortear. Encuentra también las que descartaste.</p>

  <button id="ampli-conectar" class="ampli-pastilla" hidden>
    <span class="punto" aria-hidden="true"></span><span id="ampli-estado">Conectar ampli</span>
  </button>
</header>

<main id="vista-sorteo">
  <section class="barra-controles" aria-label="Filtros del sorteo">
    <label class="control"><span>Modo</span>
      <select id="modo" class="input">
        <option value="surprise">Sorpréndeme</option>
        <option value="riffs">Riffs eléctricos</option>
        <option value="acoustic">Acústica / fingerpicking</option>
        <option value="solos">Solos y técnica</option>
      </select>
    </label>

    <div class="control"><span>Dificultad</span>
      <!-- Dos selectores en vez de diez fichas: el diseño pide una barra de una
           línea, y un rango se pide con sus dos extremos. -->
      <select id="min" class="input" aria-label="Dificultad mínima"></select>
      <span class="guion" aria-hidden="true">–</span>
      <select id="max" class="input" aria-label="Dificultad máxima"></select>
    </div>

    <button id="bandas-abrir" class="btn btn-secondary" type="button" aria-expanded="false" aria-controls="bandas-panel">Bandas <span id="bandas-estado">todas</span>
      <svg width="11" height="11" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
    </button>

    <p id="calzan" class="calzan" aria-live="polite"></p>
    <span id="stats" class="stats"></span>
  </section>

  <section id="bandas-panel" class="bandas" hidden>
    <label for="banda-q">Filtrar por bandas</label>
    <div class="banda-buscador">
      <input id="banda-q" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="escribe unas letras y elige" aria-describedby="banda-ayuda">
      <ul id="banda-sug" class="banda-sug" hidden></ul>
    </div>
    <p id="banda-ayuda" class="banda-ayuda">Sin ninguna elegida, sortea de todo el catálogo.</p>
    <ul id="banda-fichas" class="banda-fichas"></ul>
    <div id="banda-atajos" class="banda-atajos"></div>
  </section>

  <div class="columnas">
    <section id="tarjeta" class="tarjeta" aria-label="Canción para practicar"></section>
    <aside id="panel-ampli" class="panel-ampli" aria-label="Ajustes del Mustang LT25"></aside>
  </div>

  <p id="hint" class="hint" aria-live="polite"></p>

  <section class="acciones" aria-label="Acciones de la canción">
    <button id="aprendida" class="btn btn-secondary" disabled>Ya la aprendí <kbd>A</kbd></button>
    <button id="descartada" class="btn btn-secondary" disabled>No me tinca <kbd>N</kbd></button>
    <button id="despues" class="btn btn-secondary" disabled>Después <kbd>D</kbd></button>
    <button id="like" class="btn btn-secondary like" title="Me gustó (L)" aria-label="Me gustó" disabled>
      <svg width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" aria-hidden="true"><path d="M178,40c-20.65,0-38.73,8.88-50,23.89C116.73,48.88,98.65,40,78,40a62.07,62.07,0,0,0-62,62c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,228.66,240,172,240,102A62.07,62.07,0,0,0,178,40Z"></path></svg>
      <kbd>L</kbd>
    </button>
    <span class="acciones-sorteo">
      <button id="todo" class="btn btn-ghost" type="button">Sortear de todo</button>
      <button id="otra" class="btn btn-primary">Otra <kbd>espacio</kbd></button>
    </span>
  </section>
</main>

<main id="vista-listas" hidden></main>
<main id="vista-editor" hidden></main>
<script type="module" src="/app.js"></script>
</html>
